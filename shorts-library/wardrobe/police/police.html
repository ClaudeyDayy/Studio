<!DOCTYPE html>
<html><head><style>html,body{margin:0;background:transparent}canvas{display:block}</style></head>
<body><canvas id="c" width="600" height="1000"></canvas>
<script>
// Police uniform, drawn on the 600x1000 library grid (torso x 205-396, y 461-727; hat over the head x 45-555, y 50-258).
// ?v=torso_front | torso_back | hat_front | hat_back | preview
// Light comes from the upper left. Ink colour and line style match the other library pictures.
const v = (location.search.match(/v=(\w+)/) || [, "torso_front"])[1];
const c = document.getElementById("c"), g = c.getContext("2d");
const INK = "#1a1020";
const BLUE = "#2A4FB0", BLUE_L = "#3D66C9", BLUE_D = "#1F3E8F", BLUE_DD = "#18306F", NAVY = "#141A3A";
const GOLD = "#F2B921", GOLD_L = "#FFE27A", GOLD_D = "#B97E0C", GOLD_DD = "#7A4F06";
const stroke = (w = 3, col = INK) => { g.lineWidth = w; g.strokeStyle = col; g.lineJoin = "round"; g.lineCap = "round"; g.stroke(); };
const fill = (col) => { g.fillStyle = col; g.fill(); };

// ---------- the badge: a cartoon of a real police shield (gold, bevelled, blue enamel seal, ribbons, shine) ----------
function badgePath(s) {
  // shield with a peaked crest and scalloped shoulders, unit size about 1 = 50 px wide
  const P = (x, y) => [x * s, y * s];
  g.beginPath();
  g.moveTo(...P(0, -0.62));                                         // top peak
  g.bezierCurveTo(...P(0.10, -0.55), ...P(0.17, -0.52), ...P(0.24, -0.53));
  g.bezierCurveTo(...P(0.30, -0.60), ...P(0.40, -0.60), ...P(0.46, -0.52));   // right shoulder knob
  g.bezierCurveTo(...P(0.52, -0.44), ...P(0.50, -0.36), ...P(0.44, -0.31));
  g.bezierCurveTo(...P(0.50, -0.16), ...P(0.50, 0.08), ...P(0.42, 0.22));     // right side
  g.bezierCurveTo(...P(0.32, 0.42), ...P(0.14, 0.52), ...P(0, 0.62));         // to the bottom point
  g.bezierCurveTo(...P(-0.14, 0.52), ...P(-0.32, 0.42), ...P(-0.42, 0.22));
  g.bezierCurveTo(...P(-0.50, 0.08), ...P(-0.50, -0.16), ...P(-0.44, -0.31));
  g.bezierCurveTo(...P(-0.50, -0.36), ...P(-0.52, -0.44), ...P(-0.46, -0.52));
  g.bezierCurveTo(...P(-0.40, -0.60), ...P(-0.30, -0.60), ...P(-0.24, -0.53));
  g.bezierCurveTo(...P(-0.17, -0.52), ...P(-0.10, -0.55), ...P(0, -0.62));
  g.closePath();
}
function star(cx, cy, r1, r2, n, rot = -Math.PI / 2) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + (i * Math.PI) / n;
    g[i ? "lineTo" : "moveTo"](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
  }
  g.closePath();
}
function sparkle(x, y, r) {
  g.save();
  g.fillStyle = "#FFFFFF";
  g.shadowColor = "rgba(255,240,180,0.95)"; g.shadowBlur = r * 1.2;
  star(x, y, r, r * 0.16, 4, -Math.PI / 2); g.fill();
  star(x, y, r * 0.5, r * 0.1, 4, -Math.PI / 4); g.fill();
  g.restore();
}
function badge(cx, cy, s, opt = {}) {
  g.save();
  g.translate(cx, cy);
  if (opt.rot) g.rotate(opt.rot);
  // soft shadow on the cloth
  g.save(); g.translate(s * 0.05, s * 0.07); badgePath(s); g.fillStyle = "rgba(10,14,40,0.35)"; g.fill(); g.restore();
  // gold body: metal gradient (bright upper left, deep lower right)
  badgePath(s);
  const gr = g.createLinearGradient(-s * 0.5, -s * 0.6, s * 0.5, s * 0.6);
  gr.addColorStop(0, GOLD_L); gr.addColorStop(0.35, GOLD); gr.addColorStop(0.7, "#D99A12"); gr.addColorStop(1, GOLD_D);
  g.fillStyle = gr; g.fill();
  // bevel: inner rim (raised edge)
  g.save(); badgePath(s); g.clip();
  g.save(); g.scale(0.80, 0.80); badgePath(s); g.restore();
  g.lineWidth = s * 0.07; g.strokeStyle = "rgba(122,79,6,0.75)"; g.stroke();     // groove
  g.save(); g.translate(-s * 0.012, -s * 0.012); g.scale(0.80, 0.80); badgePath(s); g.restore();
  g.lineWidth = s * 0.025; g.strokeStyle = "rgba(255,246,200,0.9)"; g.stroke();  // lit lip of the groove
  // outer edge highlight (upper left) and shade (lower right)
  badgePath(s); g.lineWidth = s * 0.08; g.strokeStyle = "rgba(255,250,215,0.55)";
  g.save(); g.beginPath(); g.rect(-s, -s, s * 0.95, s * 1.1); g.clip(); badgePath(s); g.stroke(); g.restore();
  g.save(); g.beginPath(); g.rect(0, -s * 0.1, s, s); g.clip(); badgePath(s); g.strokeStyle = "rgba(110,64,0,0.55)"; g.stroke(); g.restore();
  // top ribbon "POLICE"
  const rib = (y, w, h, text, fs) => {
    g.beginPath();
    g.moveTo(-w / 2, y - h / 2); g.quadraticCurveTo(0, y - h / 2 - s * 0.05, w / 2, y - h / 2);
    g.lineTo(w / 2 - s * 0.03, y); g.lineTo(w / 2, y + h / 2);
    g.quadraticCurveTo(0, y + h / 2 - s * 0.05, -w / 2, y + h / 2);
    g.lineTo(-w / 2 + s * 0.03, y); g.closePath();
    const rg = g.createLinearGradient(0, y - h / 2, 0, y + h / 2);
    rg.addColorStop(0, "#FFF0B0"); rg.addColorStop(1, "#E5A919");
    g.fillStyle = rg; g.fill(); g.lineWidth = Math.max(1, s * 0.022); g.strokeStyle = GOLD_DD; g.stroke();
    g.fillStyle = NAVY; g.font = `900 ${fs}px "Arial Black", Arial, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(text, 0, y + s * 0.005);
  };
  rib(-s * 0.30, s * 0.70, s * 0.15, "POLICE", s * 0.115);
  // centre seal: blue enamel ring + gold star
  const sy = s * 0.07, R = s * 0.215;
  g.beginPath(); g.arc(0, sy, R + s * 0.035, 0, 7); fill(GOLD_DD);
  g.beginPath(); g.arc(0, sy, R, 0, 7);
  const eg = g.createRadialGradient(-R * 0.4, sy - R * 0.4, R * 0.1, 0, sy, R);
  eg.addColorStop(0, "#4F7FE8"); eg.addColorStop(1, "#16307A"); g.fillStyle = eg; g.fill();
  g.beginPath(); g.arc(0, sy, R * 0.80, 0, 7); g.lineWidth = Math.max(1, s * 0.015); g.strokeStyle = "rgba(255,226,122,0.9)"; g.stroke();
  star(0, sy, R * 0.66, R * 0.28, 5);
  const sg = g.createLinearGradient(-R, sy - R, R, sy + R); sg.addColorStop(0, GOLD_L); sg.addColorStop(1, GOLD_D);
  g.fillStyle = sg; g.fill(); g.lineWidth = Math.max(1, s * 0.015); g.strokeStyle = GOLD_DD; g.stroke();
  // number ribbon
  rib(s * 0.38, s * 0.42, s * 0.12, "07", s * 0.095);
  // shine: a bright diagonal streak and a thin second one
  g.globalCompositeOperation = "lighter";
  g.save(); g.rotate(-0.6);
  const sh = g.createLinearGradient(-s * 0.2, 0, s * 0.2, 0);
  sh.addColorStop(0, "rgba(255,255,255,0)"); sh.addColorStop(0.5, "rgba(255,250,220,0.55)"); sh.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = sh; g.fillRect(-s * 0.14, -s, s * 0.14, s * 2);
  g.fillStyle = "rgba(255,250,220,0.35)"; g.fillRect(s * 0.06, -s, s * 0.035, s * 2);
  g.restore();
  g.globalCompositeOperation = "source-over";
  g.restore();
  // ink outline
  badgePath(s); stroke(Math.max(2, s * 0.05));
  // sparkles (outside the clip so they can poke over the edge)
  if (!opt.noSpark) { sparkle(-s * 0.30, -s * 0.44, s * 0.24); sparkle(s * 0.33, s * 0.18, s * 0.11); }
  g.restore();
}

// ---------- torso ----------
function torso() {
  g.beginPath(); g.moveTo(250, 461); g.lineTo(354, 461);
  g.bezierCurveTo(380, 500, 397, 560, 396, 620); g.bezierCurveTo(397, 688, 362, 727, 301, 727);
  g.bezierCurveTo(240, 727, 204, 688, 205, 620); g.bezierCurveTo(204, 560, 222, 500, 250, 461); g.closePath();
}
function cloth(back) {
  torso();
  const gr = g.createLinearGradient(205, 0, 396, 0);
  gr.addColorStop(0, BLUE_L); gr.addColorStop(0.3, BLUE); gr.addColorStop(0.8, BLUE); gr.addColorStop(1, BLUE_D);
  g.fillStyle = gr; g.fill();
  g.save(); torso(); g.clip();
  const L = back ? -1 : 1, X = (x) => (back ? 601 - x : x);
  // body shade on the right, lit strip on the left (light from upper left; mirrored on the back like the old picture)
  g.fillStyle = "rgba(20,34,90,0.35)"; g.beginPath(); g.ellipse(X(398), 600, 30, 140, 0, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,0.10)"; g.beginPath(); g.ellipse(X(214), 585, 10, 95, 0.08 * L, 0, 7); g.fill();
  // under-chest and lower-belly shade
  g.fillStyle = "rgba(20,34,90,0.18)"; g.beginPath(); g.ellipse(300, 727, 110, 40, 0, 0, 7); g.fill();
  // cloth folds (soft, short strokes)
  g.strokeStyle = "rgba(18,30,80,0.45)"; g.lineWidth = 2.2; g.lineCap = "round";
  const fold = (a, b, cx, cy, d) => { g.beginPath(); g.moveTo(X(a[0]), a[1]); g.quadraticCurveTo(X(cx), cy, X(b[0]), b[1]); g.stroke(); };
  fold([232, 612], [258, 640], 240, 630); fold([370, 606], [348, 640], 362, 628);
  fold([226, 690], [250, 708], 233, 703); fold([376, 690], [355, 710], 370, 705);
  fold([300, 690], [292, 715], 300, 705);
  g.strokeStyle = "rgba(255,255,255,0.12)";
  fold([236, 608], [262, 636], 245, 624); fold([372, 690], [352, 706], 366, 700);
  // shoulder epaulettes (strips along the top edge, with a button)
  for (const side of [-1, 1]) {
    g.save(); g.translate(300 + side * 70, 476); g.rotate(side * 0.95);
    g.beginPath(); g.roundRect(-30, -7, 46, 14, 5); fill(BLUE_D); stroke(2.2);
    g.beginPath(); g.arc(-22, 0, 3.2, 0, 7); fill(GOLD); stroke(1.5);
    g.restore();
  }
  // seam line under the shoulders (yoke)
  g.strokeStyle = "rgba(18,30,80,0.5)"; g.lineWidth = 1.6; g.setLineDash([4, 3]);
  g.beginPath(); g.moveTo(222, 512); g.quadraticCurveTo(300, 528, 380, 512); g.stroke(); g.setLineDash([]);
  g.restore();
}
function belt(back) {
  const X = (x) => (back ? 601 - x : x);
  g.save(); torso(); g.clip();
  g.beginPath(); g.moveTo(200, 648); g.quadraticCurveTo(300, 656, 400, 648); g.lineTo(400, 676); g.quadraticCurveTo(300, 684, 200, 676); g.closePath();
  const bg = g.createLinearGradient(0, 648, 0, 680); bg.addColorStop(0, "#2E2634"); bg.addColorStop(1, "#140E18");
  g.fillStyle = bg; g.fill(); stroke(2.5);
  // stitching
  g.strokeStyle = "rgba(255,255,255,0.25)"; g.lineWidth = 1; g.setLineDash([3, 3]);
  g.beginPath(); g.moveTo(200, 653); g.quadraticCurveTo(300, 661, 400, 653); g.stroke();
  g.beginPath(); g.moveTo(200, 671); g.quadraticCurveTo(300, 679, 400, 671); g.stroke(); g.setLineDash([]);
  // belt loops on the shirt
  for (const x of [232, 368]) { g.beginPath(); g.roundRect(X(x) - 4, 646, 8, 33, 2); fill("#241C2A"); stroke(1.6); }
  if (!back) {
    // handcuff pouch on the left, radio on the right
    g.beginPath(); g.roundRect(X(244), 656, 26, 30, 5); fill("#1E1824"); stroke(2);
    g.beginPath(); g.roundRect(X(244) + 2, 654, 22, 9, 3); fill("#2E2634"); stroke(1.6);
    g.beginPath(); g.arc(X(244) + 13, 666, 2.6, 0, 7); fill("#C9CCD6");
    g.beginPath(); g.roundRect(X(340), 652, 22, 36, 4); fill("#24242C"); stroke(2);
    g.beginPath(); g.moveTo(X(344), 652); g.lineTo(X(344), 636); stroke(3);           // antenna
    g.beginPath(); g.roundRect(X(343), 657, 16, 9, 2); fill("#5BD0A0");                 // little screen
    for (let i = 0; i < 3; i++) { g.beginPath(); g.moveTo(X(344), 672 + i * 5); g.lineTo(X(357), 672 + i * 5); stroke(1.2, "rgba(255,255,255,0.35)"); }
    // buckle: silver frame with a shine
    g.beginPath(); g.roundRect(284, 647, 34, 34, 5);
    const kg = g.createLinearGradient(284, 647, 318, 681); kg.addColorStop(0, "#FFFFFF"); kg.addColorStop(0.45, "#C9CDD8"); kg.addColorStop(1, "#7C8294");
    g.fillStyle = kg; g.fill(); stroke(2.5);
    g.beginPath(); g.roundRect(291, 654, 20, 20, 3); fill("#241C2A"); stroke(1.5);
    g.beginPath(); g.moveTo(301, 655); g.lineTo(301, 673); stroke(3, "#B8BDCA");        // prong
    g.beginPath(); g.moveTo(288, 651); g.lineTo(298, 651); stroke(2, "rgba(255,255,255,0.9)");
  }
  g.restore();
}
function front() {
  cloth(false);
  g.save(); torso(); g.clip();
  // white undershirt V
  g.beginPath(); g.moveTo(268, 458); g.lineTo(332, 458); g.lineTo(300, 506); g.closePath(); fill("#F3F1F7");
  g.fillStyle = "rgba(160,160,190,0.35)"; g.beginPath(); g.moveTo(268, 458); g.lineTo(300, 506); g.lineTo(296, 506); g.lineTo(272, 458); g.fill();
  // button placket down the middle
  g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(293, 500, 14, 150);
  g.beginPath(); g.moveTo(293, 505); g.lineTo(293, 648); g.moveTo(307, 505); g.lineTo(307, 648); stroke(1.4, "rgba(18,30,80,0.55)");
  for (const y of [628]) { g.beginPath(); g.arc(300, y, 3.4, 0, 7); fill("#E6E8F0"); stroke(1.3); }
  // tie: knot + blade, with a gold tie bar
  g.beginPath(); g.moveTo(292, 492); g.lineTo(308, 492); g.lineTo(305, 506); g.lineTo(295, 506); g.closePath(); fill(NAVY); stroke(2);
  g.beginPath(); g.moveTo(295, 506); g.lineTo(305, 506); g.lineTo(313, 596); g.lineTo(300, 612); g.lineTo(287, 596); g.closePath(); fill(NAVY); stroke(2);
  g.beginPath(); g.moveTo(297, 510); g.lineTo(290, 594); stroke(1.5, "rgba(255,255,255,0.18)");
  g.beginPath(); g.roundRect(284, 560, 32, 5, 2); fill(GOLD); stroke(1.3);
  // collar points over the undershirt
  for (const s of [-1, 1]) {
    g.beginPath(); g.moveTo(300 + s * 36, 458); g.lineTo(300 + s * 4, 497); g.lineTo(300 + s * 20, 506); g.lineTo(300 + s * 48, 470); g.closePath();
    fill(s < 0 ? BLUE_L : BLUE); stroke(2.4);
  }
  // chest pockets with flaps and buttons
  for (const x of [250, 350]) {
    g.beginPath(); g.moveTo(x - 24, 566); g.lineTo(x + 24, 566); g.lineTo(x + 23, 604); g.quadraticCurveTo(x, 610, x - 23, 604); g.closePath();
    fill("rgba(255,255,255,0.05)"); stroke(1.8, "rgba(18,30,80,0.8)");
    g.beginPath(); g.moveTo(x, 590); g.lineTo(x, 600); stroke(1.2, "rgba(18,30,80,0.5)");                 // box pleat
    g.beginPath(); g.moveTo(x - 26, 560); g.lineTo(x + 26, 560); g.lineTo(x + 25, 574); g.lineTo(x, 582); g.lineTo(x - 25, 574); g.closePath();
    fill(BLUE_D); stroke(2.2);
    g.beginPath(); g.arc(x, 575, 3.2, 0, 7); fill(GOLD); stroke(1.3);
  }
  // name tag above the left pocket (viewer's left)
  g.beginPath(); g.roundRect(228, 540, 44, 12, 2.5);
  const ng = g.createLinearGradient(228, 540, 272, 552); ng.addColorStop(0, GOLD_L); ng.addColorStop(1, GOLD_D); g.fillStyle = ng; g.fill(); stroke(1.8);
  g.fillStyle = NAVY; g.font = '900 8px "Arial Black", Arial, sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("OFFICER", 250, 546.5);
  // pen in the left pocket
  g.beginPath(); g.roundRect(262, 552, 5, 12, 1.5); fill("#E8E9F0"); stroke(1.2);
  g.restore();
  belt(false);
  // the badge, above the right pocket (viewer's right), bigger than before and fully on the chest
  badge(340, 522, 54);
}
function backSide() {
  cloth(true);
  g.save(); torso(); g.clip();
  // collar band at the neck
  g.beginPath(); g.moveTo(258, 458); g.lineTo(342, 458); g.quadraticCurveTo(320, 482, 300, 482); g.quadraticCurveTo(280, 482, 258, 458); g.closePath(); fill(BLUE_D); stroke(2.4);
  // centre box pleat
  g.beginPath(); g.moveTo(300, 528); g.lineTo(300, 648); stroke(1.4, "rgba(18,30,80,0.5)");
  // POLICE across the back, like an uniform print
  g.save(); g.fillStyle = "#F4F1E6"; g.strokeStyle = INK; g.lineWidth = 3; g.lineJoin = "round";
  g.font = '900 26px "Arial Black", Arial, sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
  g.strokeText("POLICE", 300, 572); g.fillText("POLICE", 300, 572); g.restore();
  g.restore();
  belt(true);
}

// ---------- hat (same shape as before: dome crown + flat brim) ----------
function crown() {
  g.beginPath(); g.moveTo(96, 236);
  g.bezierCurveTo(96, 120, 190, 52, 300, 52); g.bezierCurveTo(410, 52, 504, 120, 504, 236); g.closePath();
}
function brim() { g.beginPath(); g.ellipse(300, 240, 255, 16, 0, 0, 7); }
function hat(back) {
  const X = (x) => (back ? 600 - x : x);
  crown();
  const cg = g.createRadialGradient(X(220), 100, 20, 300, 200, 300);
  cg.addColorStop(0, "#3450A8"); cg.addColorStop(0.6, "#1E2F78"); cg.addColorStop(1, "#141F55");
  g.fillStyle = cg; g.fill();
  g.save(); crown(); g.clip();
  g.fillStyle = "rgba(10,14,40,0.35)"; g.beginPath(); g.ellipse(X(500), 170, 110, 160, 0, 0, 7); g.fill();
  g.fillStyle = "rgba(255,255,255,0.16)"; g.beginPath(); g.ellipse(X(185), 110, 26, 52, 0.7 * (back ? 1 : -1), 0, 7); g.fill();
  // panel seams
  g.strokeStyle = "rgba(8,12,40,0.45)"; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(300, 54); g.lineTo(300, 180); g.stroke();
  g.beginPath(); g.moveTo(X(200), 80); g.quadraticCurveTo(X(180), 130, X(178), 180); g.stroke();
  g.beginPath(); g.moveTo(X(400), 80); g.quadraticCurveTo(X(420), 130, X(422), 180); g.stroke();
  g.beginPath(); g.arc(300, 56, 6, 0, 7); fill("#1A2660"); stroke(2);                              // top button
  // band: black-and-white check like a real police cap band
  g.beginPath(); g.rect(90, 182, 420, 56); g.clip();
  g.fillStyle = "#14141C"; g.fillRect(90, 182, 420, 56);
  const cs = 14;
  for (let r = 0; r < 4; r++) for (let k = 0; k < 32; k++) if ((r + k) % 2 === 0) { g.fillStyle = "#EDEDF2"; g.fillRect(90 + k * cs, 184 + r * cs, cs, cs); }
  g.fillStyle = "rgba(10,14,40,0.35)"; g.beginPath(); g.ellipse(X(500), 210, 90, 60, 0, 0, 7); g.fill();
  g.restore();
  // band top edge line
  g.save(); crown(); g.clip(); g.beginPath(); g.moveTo(90, 182); g.lineTo(510, 182); stroke(4); g.restore();
  // gold cord above the brim
  g.beginPath(); g.moveTo(104, 228); g.quadraticCurveTo(300, 236, 496, 228); stroke(9, INK);
  g.beginPath(); g.moveTo(104, 228); g.quadraticCurveTo(300, 236, 496, 228); stroke(5, GOLD);
  g.setLineDash([3, 5]); g.beginPath(); g.moveTo(104, 227); g.quadraticCurveTo(300, 235, 496, 227); stroke(1.6, GOLD_L); g.setLineDash([]);
  crown(); stroke(7);
  // shiny black brim
  brim();
  const bg = g.createLinearGradient(0, 224, 0, 256); bg.addColorStop(0, "#3A3550"); bg.addColorStop(0.5, "#16131F"); bg.addColorStop(1, "#0A0810");
  g.fillStyle = bg; g.fill(); stroke(6);
  g.beginPath(); g.ellipse(X(230), 236, 110, 4, 0, Math.PI * 1.05, Math.PI * 1.95); stroke(2.5, "rgba(255,255,255,0.45)");
  if (!back) {
    // cord buttons and the badge
    for (const x of [112, 488]) { g.beginPath(); g.arc(x, 228, 6, 0, 7); fill(GOLD); stroke(2); }
    badge(300, 124, 84);
  }
}

if (v === "preview") {
  g.fillStyle = "#C4C6D2"; g.fillRect(0, 0, 600, 1000);
  g.save(); g.translate(0, 0); front(); g.restore();
} else if (v === "torso_front") front();
else if (v === "torso_back") backSide();
else if (v === "hat_front") hat(false);
else if (v === "hat_back") hat(true);
</script></body></html>
